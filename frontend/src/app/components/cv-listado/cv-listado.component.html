<h1>Mis currículums</h1>
<a routerLink="/curriculums/nuevo">Crear CV</a>
@if (error()) { <p role="alert">{{ error() }}</p> }
@if (aviso()) { <p role="status">{{ aviso() }}</p> }
<ul>
  @for (cv of cvs(); track cv.id) {
  <li>
    {{ cv.titulo }} — {{ cv.nombreCompleto }}
    <a [routerLink]="['/curriculums', cv.id]">Ver</a>
    <a [routerLink]="['/curriculums', cv.id, 'editar']">Editar</a>
    <button type="button" (click)="eliminar(cv)">Eliminar</button>
  </li>
  } @empty { <li>Todavía no tenés currículums.</li> }
</ul>
