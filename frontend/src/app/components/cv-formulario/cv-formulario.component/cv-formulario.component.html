<h1>{{ id ? 'Editar CV' : 'Crear CV' }}</h1>
@if (error()) {
  <p role="alert">{{ error() }}</p>
}
<form #f="ngForm" (ngSubmit)="guardar(f)">
  <label
    >Título del CV <input name="titulo" [(ngModel)]="datos.titulo" required maxlength="150"
  /></label>
  <label
    >Puesto objetivo <input name="puesto" [(ngModel)]="datos.puesto" required maxlength="180"
  /></label>
  <label
    >Resumen <textarea name="resumen" [(ngModel)]="datos.resumen" maxlength="2000"></textarea>
  </label>
  <button type="submit">Guardar</button><a routerLink="/curriculums">Volver</a>
</form>
