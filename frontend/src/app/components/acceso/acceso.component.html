<section class="formulario-simple">
  <h1>{{ registro ? 'Crear cuenta' : 'Ingresar a ArmaTuCV' }}</h1>
  @if (acceso.aviso()) { <div class="alert alert-info" role="status">{{ acceso.aviso() }}</div> }
  @if (error()) { <div class="alert alert-danger" role="alert">{{ error() }}</div> }
  <form [formGroup]="formulario" (ngSubmit)="enviar()">
    <fieldset [disabled]="pendiente()">
      @if (registro) {
        <div class="mb-3"><label for="acceso-nombre" class="form-label">Nombre</label>
          <input id="acceso-nombre" class="form-control" formControlName="nombre" maxlength="100" autocomplete="given-name"></div>
        <div class="mb-3"><label for="acceso-apellido" class="form-label">Apellido</label>
          <input id="acceso-apellido" class="form-control" formControlName="apellido" maxlength="100" autocomplete="family-name"></div>
      }
      <div class="mb-3"><label for="acceso-email" class="form-label">Correo</label>
        <input id="acceso-email" class="form-control" type="email" formControlName="email" autocomplete="username"></div>
      <div class="mb-3"><label for="acceso-password" class="form-label">Contraseña</label>
        <input id="acceso-password" class="form-control" type="password" formControlName="password" [attr.autocomplete]="registro ? 'new-password' : 'current-password'"></div>
      @if (registro) {
        <div class="mb-3"><label for="acceso-repetir" class="form-label">Repetir contraseña</label>
          <input id="acceso-repetir" class="form-control" type="password" formControlName="repetirClave" autocomplete="new-password"></div>
        <p class="form-text">La contraseña debe tener entre 12 y 128 caracteres.</p>
      }
      <button class="btn btn-primary" type="submit" [disabled]="pendiente()">
        {{ pendiente() ? 'Procesando...' : (registro ? 'Crear cuenta' : 'Ingresar') }}
      </button>
    </fieldset>
  </form>
  <p class="mt-3">
    @if (registro) { <a routerLink="/acceso">Ya tengo cuenta</a> }
    @else { <a routerLink="/registro">Crear una cuenta</a> }
  </p>
</section>
